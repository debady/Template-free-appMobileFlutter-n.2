name: hostonewstv
description: "Votre plateforme d'actualités en continu et en direct orientée santé."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  google_fonts: ^6.3.1
  provider: ^6.1.5+1

  # Interface utilisateur
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Navigation et état
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Réseau et APIs
  http: ^1.1.2
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Médias
  video_player: ^2.8.2
  chewie: ^1.7.5
  image_picker: ^1.0.7

  # Permissions et notifications
  # flutter_local_notifications: ^16.3.2

  # Utilitaires
  intl: ^0.20.0
  url_launcher: ^6.2.4
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
